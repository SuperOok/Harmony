<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 8 88 86" width="1024" height="1000">
  <!-- Scene from the card's pattern (animals.json): a tree of height 3 next to a building.
       Stones as dots in the icon's colours. One cycle: 7 s. -->
  <rect x="0" y="0" width="100" height="100" fill="#22313A"/>

  <!-- Building: a stone with a brick on top. -->
  <ellipse cx="28" cy="88.4" rx="12" ry="1.6" fill="#000" opacity="0.22"/>
  <circle cx="28" cy="80" r="8" fill="#8C8C8C"/>
  <circle cx="28" cy="64" r="8" fill="#C74238"/>

  <!-- Tree of height 3: two wood, leaves on top. The crown sways a little. -->
  <ellipse cx="72" cy="88.4" rx="12" ry="1.6" fill="#000" opacity="0.22"/>
  <circle cx="72" cy="80" r="8" fill="#734F30"/>
  <circle cx="72" cy="64" r="8" fill="#734F30"/>
  <circle cx="72" cy="48" r="8" fill="#408F4A">
    <animate attributeName="cx" values="72;72;72.8;71.6;72.3;72;72" keyTimes="0;0.36;0.4;0.45;0.5;0.55;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- The squirrel: position, then jump tilt, then squash about the feet, then the figure itself. -->
  <g>
    <animateMotion path="M28 57 Q50 20 72 41" keyPoints="0;0;1;1" keyTimes="0;0.27;0.37;1" calcMode="spline"
                   keySplines="0 0 1 1;0.3 0 0.7 1;0 0 1 1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.92;0.97;1" dur="7s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;0;-28;-28;14;0;0"
                        keyTimes="0;0.27;0.29;0.31;0.37;0.4;1" dur="7s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale"
                          values="1 1;1 1;1.12 0.82;0.92 1.12;1 1;1 1;1.15 0.8;1 1;1 1"
                          keyTimes="0;0.22;0.26;0.29;0.32;0.365;0.38;0.42;1" dur="7s" repeatCount="indefinite"/>
        <g transform="scale(0.35) translate(-52 -89)">

          <g id="tail">
            <circle cx="31" cy="70" r="12.5" fill="#B9472A">
              <animateTransform attributeName="transform" type="translate" values="0 0;-1.6 0.6;0 0" dur="1.6s" begin="0s" repeatCount="indefinite"/>
            </circle>
            <circle cx="23.5" cy="55" r="11.5" fill="#C9542D">
              <animateTransform attributeName="transform" type="translate" values="0 0;-2.4 0.4;0 0" dur="1.6s" begin="-0.12s" repeatCount="indefinite"/>
            </circle>
            <circle cx="24.5" cy="39.5" r="10" fill="#D4612F">
              <animateTransform attributeName="transform" type="translate" values="0 0;-2.8 0;0 0" dur="1.6s" begin="-0.24s" repeatCount="indefinite"/>
            </circle>
            <circle cx="32" cy="28.5" r="8.2" fill="#DD7034">
              <animateTransform attributeName="transform" type="translate" values="0 0;-2.6 -0.6;0 0" dur="1.6s" begin="-0.36s" repeatCount="indefinite"/>
            </circle>
            <circle cx="40" cy="23" r="5.6" fill="#E4803B">
              <animateTransform attributeName="transform" type="translate" values="0 0;-2 -1;0 0" dur="1.6s" begin="-0.48s" repeatCount="indefinite"/>
            </circle>
          </g>

          <g id="leg">
            <ellipse cx="47" cy="79" rx="10" ry="8" fill="#A9411F"/>
            <ellipse cx="55" cy="86.2" rx="8.5" ry="2.7" fill="#A9411F"/>
          </g>

          <g id="body">
            <ellipse cx="52" cy="68" rx="15" ry="17" fill="#C9542D" transform="rotate(-12 52 68)"/>
            <ellipse cx="58" cy="71" rx="7.5" ry="11.5" fill="#F2EDDB" transform="rotate(-12 58 71)"/>
          </g>

          <!-- Nut: lifted to the mouth on the tree and nibbled. -->
          <g id="nut">
            <animateTransform attributeName="transform" type="translate"
                              values="0 0;0 0;-1 -6;-1 -4;-1 -6;-1 -4;-1 -6;-1 -4;-1 -6;0 0;0 0"
                              keyTimes="0;0.46;0.5;0.54;0.58;0.62;0.66;0.7;0.74;0.8;1" dur="7s" repeatCount="indefinite"/>
            <ellipse cx="69" cy="63" rx="4.6" ry="5.4" fill="#734F30"/>
            <path d="M64.2 60.4 Q69 55.6 73.8 60.4 Q69 58.8 64.2 60.4 Z" fill="#408F4A"/>
            <ellipse cx="65" cy="64.5" rx="2.6" ry="3.4" fill="#A9411F"/>
            <ellipse cx="73" cy="64.5" rx="2.6" ry="3.4" fill="#A9411F"/>
          </g>

          <!-- Head: looks across to the tree before the jump. -->
          <g id="head">
            <animateTransform attributeName="transform" type="rotate"
                              values="0 57 55;0 57 55;-10 57 55;-10 57 55;0 57 55;0 57 55;6 57 55;0 57 55"
                              keyTimes="0;0.08;0.12;0.2;0.24;0.45;0.5;1" dur="7s" repeatCount="indefinite"/>
            <path d="M58 37 Q57.5 29 61.5 26 Q65 31 64 38 Z" fill="#A9411F"/>
            <circle cx="61.6" cy="25.6" r="1.6" fill="#8E3519"/>
            <circle cx="60" cy="45" r="12" fill="#D4612F"/>
            <ellipse cx="70" cy="49" rx="6.5" ry="5.2" fill="#D4612F"/>
            <ellipse cx="66" cy="53" rx="6" ry="3.6" fill="#F2EDDB"/>
            <path d="M50.5 39 Q49.5 29 54.5 24.5 Q59 30 58.5 37 Z" fill="#C9542D"/>
            <path d="M52.6 36 Q52.4 30.5 54.6 28 Q56.6 31.5 56.4 35.5 Z" fill="#A9411F"/>
            <circle cx="54.6" cy="23.8" r="2" fill="#A9411F"/>
            <!-- Eye, blinking about its centre. -->
            <g transform="translate(64 43.5)">
              <g>
                <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1;1 1;1 0.1;1 1"
                                  keyTimes="0;0.14;0.16;0.18;0.6;0.62;0.64" dur="7s" repeatCount="indefinite"/>
                <g transform="translate(-64 -43.5)">
                  <circle cx="64" cy="43.5" r="2.4" fill="#22313A"/>
                  <circle cx="64.9" cy="42.6" r="0.8" fill="#F2EDDB"/>
                </g>
              </g>
            </g>
            <circle cx="76" cy="48" r="1.4" fill="#22313A"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
